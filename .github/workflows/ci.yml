name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: RTL check (no physical-direction utilities)
        run: npm run rtl
      - name: Translation key parity (ar and en must match)
        run: |
          node -e "
          const k=o=>Object.entries(o).flatMap(([a,b])=>typeof b==='object'?k(b).map(x=>a+'.'+x):[a]);
          const ar=k(require('./src/i18n/ar.json')), en=k(require('./src/i18n/en.json'));
          const only=(a,b)=>a.filter(x=>!b.includes(x));
          const miss=[...only(ar,en),...only(en,ar)];
          if (miss.length) { console.error('Key mismatch:', miss); process.exit(1); }
          console.log('Translation keys match:', ar.length);
          "
      - run: npm run build
      - name: Bundle budget (200 KB gzipped)
        run: npm run budget

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      AIGYM_DATABASE_URL: postgresql+psycopg://aigym_app:aigym_app@localhost:5432/aigym
      AIGYM_DATABASE_URL_MIGRATIONS: postgresql+psycopg://postgres:postgres@localhost:5432/aigym
      AIGYM_JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.8.17'
      - run: uv python install 3.11
      - run: uv sync --frozen
      - name: Bootstrap database and app role
        run: bash scripts/bootstrap_db.sh
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
